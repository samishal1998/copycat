name: gui-release

# The desktop app (GPUI) ships on gui-v* tags, separate from the CLI/daemon (v*).
on:
  push:
    tags: ["gui-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "gui tag to build (e.g. gui-v0.2.0-rc.1)"
        required: true

permissions:
  contents: write

env:
  # The daemon asks macOS for its permission state (CGPreflight*), from 10.15.
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/copycat-gpui
          key: gui-release

      - name: Build the app and the bundled daemon, both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p copycat-daemon --target $t
            cargo build --release --manifest-path apps/copycat-gpui/Cargo.toml --target $t
          done
          mkdir -p dist
          lipo -create target/aarch64-apple-darwin/release/copycatd target/x86_64-apple-darwin/release/copycatd -output dist/copycatd
          G=apps/copycat-gpui/target
          lipo -create $G/aarch64-apple-darwin/release/copycat-gpui $G/x86_64-apple-darwin/release/copycat-gpui -output dist/copycat-gpui

      - name: Signing identity
        id: sign
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Bundle, sign and make the .dmg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          apps/copycat-gpui/bundle-macos.sh "${TAG#gui-v}" "${{ steps.sign.outputs.identity }}" dist/copycat-gpui dist/copycatd dist

      # A silently ad-hoc build would break the Accessibility grant on the next
      # update; make it a red run instead.
      - name: Check the signature
        env:
          IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          APP=dist/Copycat.app
          for f in "$APP" "$APP/Contents/MacOS/copycatd"; do
            codesign -dvv "$f" 2>&1 | grep -E 'Identifier|Authority|Signature'
            codesign -dr - "$f" 2>&1 | tail -1
          done
          if [ "$IDENTITY" != "-" ]; then
            codesign -dvv "$APP" 2>&1 | grep -q "Authority=$IDENTITY"
            codesign -dvv "$APP/Contents/MacOS/copycatd" 2>&1 | grep -q "Authority=$IDENTITY"
          fi
          for f in copycat-gpui copycatd; do lipo -archs "$APP/Contents/MacOS/$f"; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          cat > notes.md <<'NOTES'
          The Copycat desktop app, now built with GPUI (native, no webview). It
          ships the daemon inside; install the CLI too and the app shares that
          daemon instead. This replaces the Tauri app.

          **Self-signed, not notarized.** macOS will refuse to open it on first
          launch. Right-click the app → Open, or clear the quarantine flag:

              xattr -dr com.apple.quarantine /Applications/Copycat.app

          Copycat needs Accessibility (System Settings → Privacy & Security).
          It uses the same bundle id and signing certificate as the Tauri app, so
          an existing grant carries over; if paste does nothing, reset it once and
          allow it again, then restart the daemon from Settings:

              tccutil reset Accessibility dev.copycat.desktop
          NOTES
          gh release create "$TAG" $PRE --title "Copycat desktop $TAG" --notes-file notes.md dist/Copycat-*.dmg
