[workspace]
resolver = "3"
members = [
    "crates/copycat-core",
    "crates/copycat-protocol",
    "crates/copycat-daemon",
    "crates/copycat-cli",
    "crates/copycat-tui",
]
# The desktop GUI is its own workspace: Tauri's Linux build needs webkit2gtk and
# friends, which must not enter the root build or CI. It is built separately.
exclude = ["apps/copycat-gui"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samimishal/copycat"

[workspace.dependencies]
copycat-core = { path = "crates/copycat-core" }
copycat-protocol = { path = "crates/copycat-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
blake3 = "1"

[profile.release]
lto = "thin"
strip = true
