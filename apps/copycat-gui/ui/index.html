<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copycat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <header class="head">
      <svg class="mark" width="18" height="18" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="10" y="15" width="18" height="13" rx="3" fill="#23272E" stroke="#3a4048"/>
        <rect x="8" y="19" width="18" height="13" rx="3" fill="#2A2F37" stroke="#E4672B"/>
        <path d="M8 19 v13" stroke="#E4672B" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="wm">copycat</span>
      <span id="dot" class="dot off" title="daemon"></span>
      <span class="push"></span>
      <button id="open-main" class="icon-btn" title="Open the full window">⤢</button>
    </header>

    <section id="mode" class="mode normal">
      <div class="mode-top">
        <span id="mode-name" class="mode-name">NORMAL</span>
        <span id="mode-count" class="mode-count"></span>
      </div>
      <div id="nextline" class="nextline" hidden>
        <span id="next-clip" class="c"></span>
        <span class="t">next ⌘V</span>
      </div>
    </section>

    <div class="list-head">
      <span class="t">History</span>
      <div class="size">
        <button id="size-down" class="step" title="Fewer per page">−</button>
        <span id="size-n" class="size-n">6</span>
        <button id="size-up" class="step" title="More per page">+</button>
      </div>
    </div>
    <div id="rows" class="rows">
      <div class="empty">Loading…</div>
    </div>

    <div class="pager">
      <button id="prev" class="page-btn" title="Newer">◀</button>
      <span id="pager-text" class="pager-text"></span>
      <button id="next" class="page-btn" title="Older">▶</button>
    </div>

    <footer class="foot">
      <button class="act" data-action="stack.start"><span class="key">S</span> stack</button>
      <button class="act" data-action="queue.capture"><span class="key">Q</span> queue</button>
      <button class="act" data-action="group.capture"><span class="key">G</span> group</button>
      <button id="pause" class="act push"><span class="key">⏯</span> <span id="pause-label">pause</span></button>
    </footer>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
