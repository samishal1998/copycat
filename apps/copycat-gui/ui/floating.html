<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copycat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="session-list.css">
  <link rel="stylesheet" href="floating.css">
</head>
<body class="collapsed">
  <!-- Collapsed: a round button above every app. Click opens the panel; drag moves it. -->
  <button id="bubble" class="bubble" aria-label="Open Copycat controls">
    <svg width="34" height="34" viewBox="4 10 26 26" fill="none" aria-hidden="true">
      <rect x="10" y="15" width="18" height="13" rx="3" fill="#23272E" stroke="#3a4048"/>
      <rect x="8" y="19" width="18" height="13" rx="3" fill="#2A2F37" stroke="#E4672B"/>
      <path d="M8 19 v13" stroke="#E4672B" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <span id="bubble-badge" class="bubble-badge" hidden></span>
  </button>

  <!-- Expanded: the panel the button opens into. Drag its header to move it. -->
  <div class="panel">
    <header id="grab" class="head">
      <span id="mode" class="mode">—</span>
      <span id="size" class="size"></span>
      <span id="dot" class="dot off" aria-hidden="true"></span>
      <button id="collapse" class="icon-btn" aria-label="Close panel">–</button>
    </header>

    <div class="body">
      <ol id="items" class="sl" aria-label="Items waiting to paste"></ol>
      <p id="idle" class="idle">No mode active. Start one below — then your own <kbd>⌘V</kbd> pastes the next item.</p>
    </div>

    <div class="actions">
      <button class="act primary w2" data-action="paste.mode">Paste next</button>
      <button class="act w2" data-action="group.paste">Paste group</button>
      <button class="act" data-action="stack.start">Stack</button>
      <button class="act" data-action="queue.capture">Queue</button>
      <button class="act" data-action="group.capture">Group</button>
      <button class="act" data-action="queue.seal">Seal</button>
      <button class="act w2" data-action="session.reset">Reset</button>
      <button class="act w2 danger" data-action="session.stop">Stop</button>
    </div>

    <footer class="foot">
      <span id="msg" class="msg" role="status"></span>
      <button id="open-main" class="link">Open Copycat</button>
    </footer>
  </div>

  <script src="session-list.js"></script>
  <script src="floating.js"></script>
</body>
</html>
