[package]
name = "copycat-gui"
version = "0.1.0"
description = "Copycat desktop — a menu-bar app and window for the clipboard daemon."
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0"

# Its own workspace, detached from the repo root (see root Cargo.toml exclude).
[workspace]

[lib]
name = "copycat_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Reuse the daemon client and typed protocol rather than reimplementing them.
copycat-protocol = { path = "../../../crates/copycat-protocol" }
copycat-core = { path = "../../../crates/copycat-core" }
copycat-launcher = { path = "../../../crates/copycat-launcher" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hand focus back to the user's app before a paste (see `hand_focus_back`),
# and let the floating windows onto a fullscreen app's Space (`float_everywhere`).
# The versions tao already resolves, so nothing new enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPanel", "NSResponder", "NSWindow"] }

[features]
# Keep the default set Tauri's template uses.
custom-protocol = ["tauri/custom-protocol"]
