[package]
name = "copycat-cli"
description = "The Copycat command line: a thin client over the daemon's local socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "copycat"
path = "src/main.rs"

[dependencies]
copycat-core = { workspace = true }
copycat-protocol = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = "3"
